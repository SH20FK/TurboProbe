<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="256" r="160" stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="100" stroke="rgba(34,197,94,0.15)" stroke-width="4"/>

  <!-- Center Metallic Probe Lightning Symbol -->
  <g filter="url(#glow)">
    <path d="M280 96L144 280h104l-32 136 152-192h-112l24-128z" fill="url(#neonGrad)"/>
  </g>
</svg>