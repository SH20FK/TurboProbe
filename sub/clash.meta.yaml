port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "TurboProbe 🇳🇱 NL"
    type: vless
    server: "dey.lnmarketplace.net"
    port: 443
    uuid: "3536e1fa-0850-44d1-b123-925ce12476cf"
    udp: true
    tls: true
    servername: "dey.lnmarketplace.net"
    client-fingerprint: "chrome"
    network: xhttp

proxy-groups:
  - name: "⚡ TURBOPROBE-AUTO"
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "TurboProbe 🇳🇱 NL"
  - name: "🚀 SELECT"
    type: select
    proxies:
      - "⚡ TURBOPROBE-AUTO"
      - "TurboProbe 🇳🇱 NL"

rules:
  - DOMAIN-SUFFIX,openai.com,⚡ TURBOPROBE-AUTO
  - DOMAIN-SUFFIX,claude.ai,⚡ TURBOPROBE-AUTO
  - DOMAIN-SUFFIX,youtube.com,⚡ TURBOPROBE-AUTO
  - DOMAIN-SUFFIX,discord.com,⚡ TURBOPROBE-AUTO
  - DOMAIN-SUFFIX,instagram.com,⚡ TURBOPROBE-AUTO
  - DOMAIN-SUFFIX,x.com,⚡ TURBOPROBE-AUTO
  - DOMAIN-SUFFIX,twitter.com,⚡ TURBOPROBE-AUTO
  - GEOIP,RU,DIRECT
  - MATCH,⚡ TURBOPROBE-AUTO
