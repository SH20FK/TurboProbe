name: Build and Release TurboProbe VPN

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    name: Build Go Core Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: core/go.mod

      - name: Tidy dependencies
        working-directory: ./core
        run: go mod tidy

      - name: Build Windows amd64 Core
        working-directory: ./core
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          go build -ldflags="-s -w" -o ../dist/turboprobe-core-windows-amd64.exe ./main.go

      - name: Build Linux amd64 Core
        working-directory: ./core
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ../dist/turboprobe-core-linux-amd64 ./main.go

      - name: Build Linux arm64 Core
        working-directory: ./core
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ../dist/turboprobe-core-linux-arm64 ./main.go

      - name: Upload Core Binaries
        uses: actions/upload-artifact@v4
        with:
          name: core-binaries
          path: dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Initialize Android Platform
        working-directory: ./app
        run: flutter create --platforms=android --org com.turboprobe --overwrite .

      - name: Get Flutter Packages
        working-directory: ./app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./app
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: turboprobe-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-2022
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Configure Visual Studio Generator
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          flutter config --enable-windows-desktop

      - name: Initialize Windows Platform
        working-directory: ./app
        run: flutter create --platforms=windows --org com.turboprobe --overwrite .

      - name: Get Flutter Packages
        working-directory: ./app
        run: flutter pub get

      - name: Download Go Core Binary
        uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: app/assets/bin

      - name: Build Windows Desktop
        working-directory: ./app
        run: flutter build windows --release

      - name: Bundle Windows App
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist-windows.zip

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: turboprobe-windows-x64
          path: dist-windows.zip

  build-linux:
    name: Build Linux Desktop App
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Initialize Linux Platform
        working-directory: ./app
        run: flutter create --platforms=linux --org com.turboprobe --overwrite .

      - name: Get Flutter Packages
        working-directory: ./app
        run: flutter pub get

      - name: Build Linux Desktop
        working-directory: ./app
        run: flutter build linux --release

      - name: Package Linux Desktop
        run: |
          tar -czvf dist-linux.tar.gz -C app/build/linux/x64/release/bundle .

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: turboprobe-linux-x64
          path: dist-linux.tar.gz

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-core, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core-binaries/*
            turboprobe-android-apk/*.apk
            turboprobe-windows-x64/*.zip
            turboprobe-linux-x64/*.tar.gz
          generate_release_notes: true
