name: RU-Vantage Verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ru-verify:
    name: Deep-verify pool from a Russian vantage point
    runs-on: self-hosted
    timeout-minutes: 120
    defaults:
      run:
        # Windows self-hosted: plain `bash` resolves to the WSL stub in System32,
        # so Git Bash is pinned by absolute path instead.
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run deep verification from RU vantage
        run: |
          ulimit -n 65536 || true
          python tools/service_prober.py --vantage=ru-local

      - name: Commit and push ru-verified.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sub/ru-verified.json
          if git diff --staged --quiet; then
            echo "No RU-verification updates."
          else
            git commit -m "chore(ru-vantage): update RU-verified nodes [$(date -u +'%Y-%m-%d %H:%M UTC')]" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git pull --rebase origin main || true
            git push origin main
          fi
