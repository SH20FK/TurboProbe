name: TurboProbe TGProxy Pipeline

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: tgproxy-pipeline
  cancel-in-progress: true

jobs:
  harvest-tg-proxies:
    name: Harvest & Verify TG Proxies
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: Run TGProxy Sleuth Discovery Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tgproxy/discover_tg_sources.py || true

      - name: Run TGProxy Harvester & DC Verifier
        run: |
          python -c "
          import asyncio, sys
          sys.path.insert(0, '.')
          from tgproxy.tg_aggregator import run_tg_harvest
          from tgproxy.exporter import export_all

          async def main():
              proxies = await run_tg_harvest(test_limit=0)
              export_all(proxies)

          asyncio.run(main())
          "

      - name: Verify and Commit Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/tg/ docs/tg/ tgproxy/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(tgproxy): auto-update telegram proxies [skip ci]"
            git push origin main
          fi
