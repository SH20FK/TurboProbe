name: VPN Subscription Auto-Aggregator

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска'
        required: true
        default: 'fast'
        type: choice
        options:
          - 'fast'        # ⚡ Быстрый (Tier-1 источники + Xray тест, ~1.5 мин)
          - 'full'        # 🌐 Полный краулер (1500+ источников, ~15 мин)
          - 'prober_only' # 🔬 Только Xray-пробер текущих ключей (~30 сек)

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    name: Aggregate & Deduplicate VPN Subscriptions
    runs-on: ubuntu-latest

    steps:
      - name: Increase file descriptor limit
        run: |
          ulimit -n 65536 || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xray
          key: xray-linux-64-v1.8.24

      - name: Install dependencies & Xray-core
        run: |
          ulimit -n 65536 || true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -f /usr/local/bin/xray ]; then
            curl -L -s -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            sudo unzip -o /tmp/xray.zip -d /usr/local/bin/
            sudo chmod +x /usr/local/bin/xray
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turboprobe-web/package.json

      - name: Verify Web Build
        run: |
          cd turboprobe-web
          npm ci || npm install
          npm run build

      - name: Discover new subscription sources
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -n 65536 || true
          python tools/discover_sources.py

      - name: Run VPN Auto-Aggregator (Fast)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'fast' }}
        run: |
          ulimit -n 65536 || true
          python tools/aggregator.py --fast

      - name: Run VPN Auto-Aggregator (Full)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full') }}
        run: |
          ulimit -n 65536 || true
          python tools/aggregator.py

      - name: Run Deep Service Prober (Real Tunnel Verifier)
        run: |
          ulimit -n 65536 || true
          if [ "${{ github.event.inputs.mode }}" = "fast" ]; then
            python tools/service_prober.py --limit 1000
          elif [ "${{ github.event.inputs.mode }}" = "prober_only" ]; then
            python tools/service_prober.py --limit 500
          else
            python tools/service_prober.py --limit 0
          fi

      - name: Copy subscriptions to docs for GitHub Pages hosting
        run: |
          mkdir -p docs/sub
          cp -r sub/* docs/sub/

      - name: Commit and push updated subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Backup newly generated subscription and crawler artifacts to /tmp
          mkdir -p /tmp/tp_backup_sub /tmp/tp_backup_tools
          cp -r sub/* /tmp/tp_backup_sub/ 2>/dev/null || true
          cp tools/discovered_sources.json tools/dead_nodes.json tools/node_history.json tools/telegram_feed.txt /tmp/tp_backup_tools/ 2>/dev/null || true

          # 2. Fetch and hard-reset to latest origin/main to preserve all UI/frontend changes
          git fetch origin main
          git reset --hard origin/main

          # 3. Restore newly generated subscription files
          mkdir -p sub docs/sub
          cp -r /tmp/tp_backup_sub/* sub/
          cp -r /tmp/tp_backup_sub/* docs/sub/
          cp /tmp/tp_backup_tools/* tools/ 2>/dev/null || true

          # 4. Stage ONLY subscription and database files
          git add -f sub/ docs/sub/ tools/discovered_sources.json tools/dead_nodes.json tools/node_history.json tools/telegram_feed.txt || true
          if git diff --cached --quiet; then
            echo "No subscription updates detected relative to origin/main."
          else
            git commit -m "chore(sub): auto-update VPN subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            
            # Resilient push retry loop
            MAX_ATTEMPTS=5
            ATTEMPT=1
            PUSHED=0
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Push attempt $ATTEMPT of $MAX_ATTEMPTS..."
              if git push origin HEAD:main; then
                PUSHED=1
                echo "Successfully pushed changes to main."
                break
              fi
              echo "Push failed. Re-fetching origin/main and retrying..."
              git fetch origin main
              git reset --hard origin/main
              cp -r /tmp/tp_backup_sub/* sub/
              cp -r /tmp/tp_backup_sub/* docs/sub/
              cp /tmp/tp_backup_tools/* tools/ 2>/dev/null || true
              git add -f sub/ docs/sub/ tools/discovered_sources.json tools/dead_nodes.json tools/node_history.json tools/telegram_feed.txt || true
              git commit -m "chore(sub): auto-update VPN subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" || true
              SLEEP_TIME=$((ATTEMPT * 2))
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ $PUSHED -ne 1 ]; then
              echo "Failed to push after $MAX_ATTEMPTS attempts."
              exit 1
            fi
          fi
