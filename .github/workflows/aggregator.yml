name: VPN Subscription Auto-Aggregator

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска'
        required: true
        default: 'fast'
        type: choice
        options:
          - 'fast'        # ⚡ Быстрый (Tier-1 источники + Xray тест, ~1.5 мин)
          - 'full'        # 🌐 Полный краулер (1500+ источников, ~15 мин)
          - 'prober_only' # 🔬 Только Xray-пробер текущих ключей (~30 сек)

permissions:
  contents: write

jobs:
  aggregate:
    name: Aggregate & Deduplicate VPN Subscriptions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Xray-core
        run: |
          python -m pip install --upgrade pip
          pip install "requests[socks]" urllib3 orjson httpx aiohttp
          curl -L -s -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -o /tmp/xray.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - name: Discover new subscription sources
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -n 65536 || true
          python tools/discover_sources.py

      - name: Run VPN Auto-Aggregator (Fast)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'fast' }}
        run: |
          ulimit -n 65536 || true
          python tools/aggregator.py --fast

      - name: Run VPN Auto-Aggregator (Full)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full') }}
        run: |
          ulimit -n 65536 || true
          python tools/aggregator.py

      - name: Run Deep Service Prober (Real Tunnel Verifier)
        run: |
          ulimit -n 65536 || true
          if [ "${{ github.event.inputs.mode }}" = "fast" ]; then
            python tools/service_prober.py --limit 1000
          else
            python tools/service_prober.py --limit 0
          fi

      - name: Copy subscriptions to docs for GitHub Pages hosting
        run: |
          mkdir -p docs/sub
          cp -r sub/* docs/sub/

      - name: Commit and push updated subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sub/ docs/sub/ tools/discovered_sources.json tools/dead_nodes.json tools/node_history.json tools/telegram_feed.txt || true
          if git diff --staged --quiet; then
            echo "No subscription updates detected."
          else
            git commit -m "chore(sub): auto-update VPN subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git checkout -- . || true
            git fetch origin main
            git push origin HEAD:main || (git pull --rebase -X theirs origin main && git push origin HEAD:main) || git push -f origin HEAD:main
          fi
