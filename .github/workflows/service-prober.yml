name: Service & Accessibility Prober

on:
  schedule:
    # Runs every 2 hours automatically
    - cron: '30 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Количество нод для проверки (0 = все)'
        required: true
        default: '500'
        type: string

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    name: Probe Services & Domestic Russian Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Increase file descriptor limit
        run: |
          ulimit -n 65536 || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xray
          key: xray-linux-64-v1.8.24

      - name: Install dependencies & Xray-core
        run: |
          ulimit -n 65536 || true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -f /usr/local/bin/xray ]; then
            curl -L -s -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            sudo unzip -o /tmp/xray.zip -d /usr/local/bin/
            sudo chmod +x /usr/local/bin/xray
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turboprobe-web/package.json

      - name: Verify Web Build
        run: |
          cd turboprobe-web
          npm ci || npm install
          npm run build

      - name: Run Deep Service Prober
        run: |
          ulimit -n 65536 || true
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="500"
          fi
          python tools/service_prober.py --limit "$LIMIT"

      - name: Copy subscriptions to docs for GitHub Pages hosting
        run: |
          mkdir -p docs/sub
          cp -r sub/* docs/sub/

      - name: Commit and push probed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Fetch latest origin/main to prevent non-fast-forward push rejections
          git fetch origin main
          git reset --soft origin/main

          git add -f sub/ docs/sub/ tools/dead_nodes.json tools/node_history.json || true
          if git diff --cached --quiet; then
            echo "No changes in probed services relative to origin/main."
          else
            git commit -m "chore(prober): update verified service feeds [$(date -u +'%Y-%m-%d %H:%M UTC')]" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            
            # Resilient push retry loop
            MAX_ATTEMPTS=5
            ATTEMPT=1
            PUSHED=0
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Push attempt $ATTEMPT of $MAX_ATTEMPTS..."
              if git push origin HEAD:main; then
                PUSHED=1
                echo "Successfully pushed probed services to main."
                break
              fi
              echo "Push failed. Re-fetching origin/main and retrying..."
              git fetch origin main
              git reset --soft origin/main
              git add -f sub/ docs/sub/ tools/dead_nodes.json tools/node_history.json || true
              git commit -m "chore(prober): update verified service feeds [$(date -u +'%Y-%m-%d %H:%M UTC')]" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" || true
              SLEEP_TIME=$((ATTEMPT * 2))
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ $PUSHED -ne 1 ]; then
              echo "Failed to push after $MAX_ATTEMPTS attempts."
              exit 1
            fi
          fi
