name: RU-Vantage Verification

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum candidates (start with 50; 0 = all)'
        default: '50'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ru-intersvyaz-verification
  cancel-in-progress: false

jobs:
  ru-verify:
    name: HTTPS tunnels from Chelyabinsk / Intersvyaz
    runs-on: [self-hosted, Windows, ru-intersvyaz]
    timeout-minutes: 120
    env:
      TP_XRAY_WORKERS: '2'
      TP_BATCH_SIZE: '6'
      PROBE_LIMIT: ${{ inputs.limit }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probe from the actual ISP (other VPNs must be off)
        run: |
          if ($env:PROBE_LIMIT -notmatch '^\d+$') { throw 'Invalid candidate limit' }
          python tools/service_prober.py --vantage ru-local --limit $env:PROBE_LIMIT --batch-size 6 --timeout 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish only the RU snapshot to the selected branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f sub/ru-verified.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'fix(ru-vantage): fresh Intersvyaz tunnel measurements'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin $env:BRANCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
