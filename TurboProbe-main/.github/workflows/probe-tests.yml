name: Probe regression tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - 'worker/**'
      - 'tests/**'
      - 'turboprobe-web/**'
      - '.github/workflows/probe-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --test tests/test_ru_worker.mjs
      - run: npm ci && npm run build
        working-directory: turboprobe-web
